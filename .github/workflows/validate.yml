name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f favicon.svg
          test -f 404.html
          test -f .nojekyll

      - name: Ensure VPN project is excluded
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='README.md' \
              'github.com/Amirho33ein7/amirvpn' index.html styles.css script.js 404.html favicon.svg; then
            echo "amirvpn must not be referenced by portfolio site files."
            exit 1
          fi

      - name: Check required profile links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://github.com/Amirho33ein7' index.html
          grep -Fq 'https://www.linkedin.com/in/amir-hossein-900009435/' index.html

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if not value or value.startswith(("#", "http://", "https://", "mailto:", "data:")):
                          continue
                      self.refs.append(value.split("?", 1)[0].split("#", 1)[0])

          parser = Parser()
          parser.feed(html)

          missing = []
          for ref in sorted(set(parser.refs)):
              candidate = (root / ref.lstrip("/")).resolve()
              if not candidate.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit("Missing local references: " + ", ".join(missing))
          print("All local HTML references resolve.")
          PY

      - name: Validate deployed audio resource
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, time, urllib.request
          from pathlib import Path

          base = "https://amirho33ein7.github.io/Website-/"
          audio = base + "riserayss%20-%20Worry%20-%20Ultra%20Slowed%20(128).mp3"

          # Wait briefly for GitHub Pages to publish the pushed commit.
          last = None
          for attempt in range(12):
              try:
                  req = urllib.request.Request(base + "?audio-regression=1", headers={"Cache-Control": "no-cache"})
                  with urllib.request.urlopen(req, timeout=15) as r:
                      html = r.read().decode("utf-8", "replace")
                      last = html
                      if "20261003-audiofix" in html:
                          break
              except Exception:
                  pass
              time.sleep(5)
          else:
              raise SystemExit("Deployed page did not expose the new audio script marker.")

          req = urllib.request.Request(audio, method="HEAD", headers={"Cache-Control":"no-cache"})
          with urllib.request.urlopen(req, timeout=20) as r:
              headers = {k.lower(): v for k,v in r.headers.items()}
              print(json.dumps({
                  "status": r.status,
                  "content_type": headers.get("content-type"),
                  "content_length": headers.get("content-length"),
                  "accept_ranges": headers.get("accept-ranges"),
                  "content_range": headers.get("content-range"),
              }, indent=2))

              ct = (headers.get("content-type") or "").lower()
              if not (("audio/mpeg" in ct) or ("audio/mp3" in ct)):
                  raise SystemExit("Deployed audio Content-Type is not an MP3 audio type: " + ct)
              if headers.get("accept-ranges","").lower() != "bytes":
                  raise SystemExit("Deployed audio does not advertise Accept-Ranges: bytes")

          data = urllib.request.urlopen(audio, timeout=30).read()
          Path("/tmp/site-audio.mp3").write_bytes(data)
          if len(data) < 100000:
              raise SystemExit(f"Deployed MP3 is unexpectedly small: {len(data)} bytes")
          print("Downloaded deployed audio:", len(data), "bytes")
          PY
          python3 -m pip install --quiet mutagen
          python3 - <<'PY'
          from mutagen.mp3 import MP3
          p="/tmp/site-audio.mp3"
          audio=MP3(p)
          print("MP3 info:", audio.info)
          if not audio.info.length or audio.info.length <= 0:
              raise SystemExit("MP3 duration is invalid.")
          if not audio.info.sample_rate or not audio.info.channels:
              raise SystemExit("MP3 sample rate/channels are invalid.")
          print(f"PASS: duration={audio.info.length:.3f}s sample_rate={audio.info.sample_rate}Hz channels={audio.info.channels} bitrate={getattr(audio.info,'bitrate',None)}")

      - name: Browser-test deployed audio
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          node <<'NODE'
          const { chromium } = require('playwright');

          (async() => {
            const browser = await chromium.launch({headless:true});
            try {
              const page = await browser.newPage({viewport:{width:390,height:844}});
              const errors = [];
              page.on('pageerror', e => errors.push('pageerror: ' + e.message));
              page.on('console', m => {
                if (m.type() === 'error') errors.push('console: ' + m.text());
              });

              const url = 'https://amirho33ein7.github.io/Website-/?deployed-audio-test=1';
              await page.goto(url, {waitUntil:'networkidle', timeout:60000});

              const stateBefore = await page.evaluate(() => {
                const a = document.querySelector('#backgroundMusic');
                return a ? {
                  src: a.currentSrc,
                  readyState: a.readyState,
                  networkState: a.networkState,
                  duration: a.duration,
                  paused: a.paused,
                  muted: a.muted,
                  defaultMuted: a.defaultMuted,
                  volume: a.volume,
                  error: a.error ? {code:a.error.code, message:a.error.message || ''} : null
                } : null;
              });

              if (!stateBefore) throw new Error('deployed audio element missing');

              await page.mouse.click(140, 150);
              await page.waitForTimeout(1800);

              const stateAfter = await page.evaluate(() => {
                const a = document.querySelector('#backgroundMusic');
                return {
                  src: a.currentSrc,
                  currentTime: a.currentTime,
                  readyState: a.readyState,
                  networkState: a.networkState,
                  duration: a.duration,
                  paused: a.paused,
                  muted: a.muted,
                  defaultMuted: a.defaultMuted,
                  volume: a.volume,
                  error: a.error ? {code:a.error.code, message:a.error.message || ''} : null
                };
              });

              console.log(JSON.stringify({stateBefore,stateAfter,errors},null,2));

              if (errors.length) throw new Error('runtime errors: ' + errors.join(' | '));
              if (!(stateAfter.duration > 0)) throw new Error('deployed audio has no duration');
              if (stateAfter.muted || stateAfter.defaultMuted || !(stateAfter.volume > 0)) throw new Error('deployed audio is muted or volume is zero');
              if (stateAfter.paused) throw new Error('deployed audio is paused after user gesture');
              if (!(stateAfter.currentTime > 0.2)) throw new Error('deployed audio timeline is still stuck at 0:00: ' + JSON.stringify(stateAfter));
              console.log('DEPLOYED AUDIO: PASS');
              await page.close();
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE

      - name: Smoke test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/index-response.html
          grep -Fq 'Amirhossein' /tmp/index-response.html
          grep -Fq 'Projects are only' /tmp/index-response.html
          grep -Fq 'ghandchand' /tmp/index-response.html
          grep -Fq 'ario-game' /tmp/index-response.html
          grep -Fq 'amirbot' /tmp/index-response.html
          grep -Fq 'food-delivery-python' /tmp/index-response.html
          grep -Fq 'benzine-fuel-level-checker' /tmp/index-response.html
          grep -Fq 'kalorichand' /tmp/index-response.html
          if grep -Fqi 'github.com/Amirho33ein7/amirvpn' /tmp/index-response.html; then
            echo "amirvpn leaked into generated HTML."
            exit 1
          fi

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          python3 -m http.server 8080 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');

          (async() => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const viewport of [
                {name:'desktop', width:1440, height:900},
                {name:'mobile', width:390, height:844},
              ]) {
                const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
                const errors = [];
                page.on('pageerror', err => errors.push('pageerror: ' + err.message));
                page.on('console', msg => {
                  if (msg.type() === 'error') errors.push('console: ' + msg.text());
                });

                await page.goto('http://127.0.0.1:8080/', {waitUntil:'networkidle'});
                await page.waitForTimeout(300);

                // Use a real browser gesture so the site's audio activation path is exercised.
                await page.mouse.click(120, 120);
                await page.waitForTimeout(250);

                const audioState = await page.evaluate(() => {
                  const audio = document.querySelector('#backgroundMusic');
                  if (!audio) return {present:false};
                  return {
                    present:true,
                    paused:audio.paused,
                    muted:audio.muted,
                    defaultMuted:audio.defaultMuted,
                    volume:audio.volume,
                    readyState:audio.readyState,
                    duration:audio.duration,
                    currentSrc:audio.currentSrc
                  };
                });

                if (!audioState.present) throw new Error(viewport.name + ' background music element missing');
                if (audioState.muted || audioState.defaultMuted) throw new Error(viewport.name + ' background music is muted');
                if (!(audioState.volume > 0)) throw new Error(viewport.name + ' background music volume is zero');
                if (!(audioState.readyState >= 2) || !(audioState.duration > 0)) {
                  throw new Error(viewport.name + ' background music did not load a playable media resource: ' + JSON.stringify(audioState));
                }
                if (audioState.paused) throw new Error(viewport.name + ' background music did not start after real user interaction');

                const state = await page.evaluate(() => {
                  const items = [...document.querySelectorAll('.timeline-item')];
                  const project7 = document.querySelector('.timeline-item[data-index="07"]');
                  const visual7 = project7?.querySelector('.visual-rahhesab');
                  const card7 = project7?.querySelector('.rahhesab-card');
                  const overflow = document.documentElement.scrollWidth > document.documentElement.clientWidth + 2;
                  const badItems = items.filter(el => {
                    const r = el.getBoundingClientRect();
                    return r.left < -2 || r.right > window.innerWidth + 2;
                  }).map(el => el.dataset.index);
                  const visualRect = visual7?.getBoundingClientRect();
                  const cardRect = card7?.getBoundingClientRect();
                  const cardStyle = card7 ? getComputedStyle(card7) : null;
                  return {
                    title: document.title,
                    projects: items.length,
                    project7: !!project7,
                    rahhesabLink: !!project7?.querySelector('a[href="https://github.com/Amirho33ein7/rah-hesab"]'),
                    summary7: [...document.querySelectorAll('[data-count]')].some(el => el.dataset.count === '7'),
                    rahhesabVisualVisible: !!visualRect && visualRect.width > 0 && visualRect.height > 0,
                    rahhesabCardVisible: !!cardRect && cardRect.width > 0 && cardRect.height > 0 && cardStyle?.visibility !== 'hidden' && cardStyle?.display !== 'none' && Number(cardStyle?.opacity || 1) > 0,
                    overflow,
                    badItems
                  };
                });

                if (errors.length) throw new Error(viewport.name + ' runtime errors: ' + errors.join(' | '));
                if (state.projects !== 7) throw new Error(viewport.name + ' expected 7 timeline projects, got ' + state.projects);
                if (!state.project7 || !state.rahhesabLink) throw new Error(viewport.name + ' PROJECT 07 / Rahhesab link missing');
                if (!state.summary7) throw new Error(viewport.name + ' 7-project summary counter missing');
                if (!state.rahhesabVisualVisible || !state.rahhesabCardVisible) throw new Error(viewport.name + ' Rahhesab visual/card is not visible');
                if (state.overflow || state.badItems.length) throw new Error(viewport.name + ' horizontal overflow: ' + JSON.stringify(state.badItems));

                await page.close();
                console.log(viewport.name + ': PASS');
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
