name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f favicon.svg
          test -f 404.html
          test -f .nojekyll
          test -f sargozasht/index.html

      - name: Ensure VPN project is excluded
        shell: bash
        run: |
          set -euo pipefail
          if grep -Rni --exclude-dir=.git --exclude-dir=.github --exclude='README.md' \
              'github.com/Amirho33ein7/amirvpn' index.html styles.css script.js 404.html favicon.svg; then
            echo "amirvpn must not be referenced by portfolio site files."
            exit 1
          fi

      - name: Check required profile links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'https://github.com/Amirho33ein7' index.html
          grep -Fq 'https://www.linkedin.com/in/amir-hossein-900009435/' index.html

      - name: Validate local asset references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlparse

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("src", "href"):
                      value = attrs.get(key)
                      if not value or value.startswith(("#", "http://", "https://", "mailto:", "data:")):
                          continue
                      self.refs.append(value.split("?", 1)[0].split("#", 1)[0])

          parser = Parser()
          parser.feed(html)

          missing = []
          for ref in sorted(set(parser.refs)):
              candidate = (root / ref.lstrip("/")).resolve()
              if not candidate.exists():
                  missing.append(ref)

          if missing:
              raise SystemExit("Missing local references: " + ", ".join(missing))
          print("All local HTML references resolve.")
          PY

      - name: Smoke test static site
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8080 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/tmp/index-response.html
          grep -Fq 'Amirhossein' /tmp/index-response.html
          grep -Fq 'Projects are only' /tmp/index-response.html
          grep -Fq 'ghandchand' /tmp/index-response.html
          grep -Fq 'ario-game' /tmp/index-response.html
          grep -Fq 'amirbot' /tmp/index-response.html
          grep -Fq 'food-delivery-python' /tmp/index-response.html
          grep -Fq 'benzine-fuel-level-checker' /tmp/index-response.html
          grep -Fq 'kalorichand' /tmp/index-response.html
          grep -Fq 'https://github.com/Amirho33ein7/RAAD' /tmp/index-response.html
          grep -Fq 'Rank Analysis And Dashboard' /tmp/index-response.html
          grep -Fq 'داشبورد تحلیل رنک' /tmp/index-response.html
          grep -Fq 'class="raad-reactor-svg"' /tmp/index-response.html
          grep -Fq 'animation: raadReactorSpin 7s linear infinite' styles.css
          grep -Fq 'animation: raadReactorPulse 5s ease-out infinite' styles.css
          grep -Fq 'data-count="9"' /tmp/index-response.html
          grep -Fq 'href="./sargozasht/"' /tmp/index-response.html
          grep -Fq 'visual-sargozasht' /tmp/index-response.html
          curl --fail --silent --show-error http://127.0.0.1:8080/sargozasht/ >/tmp/sargozasht-response.html
          grep -Fq 'سرگذشت — شبیه‌ساز زندگی' /tmp/sargozasht-response.html
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/sargozasht-cover.webp -o /tmp/sargozasht-cover.webp
          test -s /tmp/sargozasht-cover.webp
          grep -Fq 'prefers-reduced-motion: reduce' styles.css
          if grep -Eqi 'EXCLUDED BY REQUEST|این repository عمداً در Portfolio نمایش داده نمی‌شود|<strong>[[:space:]]*amirvpn[[:space:]]*</strong>' /tmp/index-response.html; then
            echo "Obsolete amirvpn notice must not appear in portfolio HTML."
            exit 1
          fi
          if grep -Fqi 'github.com/Amirho33ein7/amirvpn' /tmp/index-response.html; then
            echo "amirvpn leaked into generated HTML."
            exit 1
          fi

      - name: Browser smoke test
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright
          npx playwright install --with-deps chromium >/tmp/playwright-install.log 2>&1
          python3 -m http.server 8080 >/tmp/portfolio-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 2
          node <<'NODE'
          const { chromium } = require('playwright');

          (async() => {
            const browser = await chromium.launch({headless:true});
            try {
              for (const viewport of [
                {name:'desktop', width:1440, height:900},
                {name:'mobile', width:390, height:844},
              ]) {
                const page = await browser.newPage({viewport:{width:viewport.width,height:viewport.height}});
                const errors = [];
                page.on('pageerror', err => errors.push('pageerror: ' + err.message));
                page.on('console', msg => {
                  if (msg.type() === 'error') errors.push('console: ' + msg.text());
                });

                await page.goto('http://127.0.0.1:8080/', {waitUntil:'networkidle'});
                await page.waitForTimeout(300);

                const state = await page.evaluate(() => {
                  const items = [...document.querySelectorAll('.timeline-item')];
                  const project7 = document.querySelector('.timeline-item[data-index="07"]');
                  const visual7 = project7?.querySelector('.visual-rahhesab');
                  const card7 = project7?.querySelector('.rahhesab-card');
                  const project8 = document.querySelector('.timeline-item[data-index="08"]');
                  const project9 = document.querySelector('.timeline-item[data-index="09"]');
                  const visual9 = project9?.querySelector('.visual-sargozasht');
                  const card9 = project9?.querySelector('.sargozasht-cover');
                  const visual8 = project8?.querySelector('.visual-raad');
                  const card8 = project8?.querySelector('.raad-card');
                  const expansion8 = project8?.querySelector('.raad-expansion');
                  const overflow = document.documentElement.scrollWidth > document.documentElement.clientWidth + 2;
                  const badItems = items.filter(el => {
                    const r = el.getBoundingClientRect();
                    return r.left < -2 || r.right > window.innerWidth + 2;
                  }).map(el => el.dataset.index);
                  const visualRect = visual7?.getBoundingClientRect();
                  const cardRect = card7?.getBoundingClientRect();
                  const cardStyle = card7 ? getComputedStyle(card7) : null;
                  return {
                    title: document.title,
                    projects: items.length,
                    project7: !!project7,
                    rahhesabLink: !!project7?.querySelector('a[href="https://github.com/Amirho33ein7/rah-hesab"]'),
                    project8: !!project8,
                    project9: !!project9,
                    gameLaunchLink: !!project9?.querySelector('a[href="./sargozasht/"]'),
                    summary9: [...document.querySelectorAll('[data-count]')].some(el => el.dataset.count === '9'),
                    sargozashtVisualVisible: !!visual9 && visual9.getBoundingClientRect().width > 0 && visual9.getBoundingClientRect().height > 0,
                    sargozashtCardVisible: !!card9 && card9.getBoundingClientRect().width > 0 && card9.getBoundingClientRect().height > 0 && getComputedStyle(card9).visibility !== 'hidden' && getComputedStyle(card9).display !== 'none' && Number(getComputedStyle(card9).opacity || 1) > 0,
                    sargozashtImageLoaded: !!card9 && card9.complete && card9.naturalWidth > 0,
                    raadLink: !!project8?.querySelector('a[href="https://github.com/Amirho33ein7/RAAD"]'),
                    raadExpansionVisible: !!expansion8 && expansion8.getBoundingClientRect().width > 0 && expansion8.getBoundingClientRect().height > 0,
                    raadEnglishExpansion: !!expansion8 && ['Rank', 'Analysis', 'And', 'Dashboard'].every(word => expansion8.textContent.includes(word)),
                    raadPersianMeaning: !!expansion8?.querySelector('.raad-expansion-meaning') && expansion8.querySelector('.raad-expansion-meaning').textContent.includes('داشبورد تحلیل رنک'),
                    obsoleteVpnNotice: /EXCLUDED BY REQUEST|این repository عمداً در Portfolio نمایش داده نمی‌شود|amirvpn/i.test(document.body.innerText),
                    raadReactor: !!project8?.querySelector('.raad-reactor-svg'),
                    raadReactorSpinDuration: project8?.querySelector('.raad-reactor-rotor') ? getComputedStyle(project8.querySelector('.raad-reactor-rotor')).animationDuration : '',
                    raadReactorPulseDuration: project8?.querySelector('.raad-reactor-pulse') ? getComputedStyle(project8.querySelector('.raad-reactor-pulse')).animationDuration : '',
                    raadReactorPulse: !!project8?.querySelector('.raad-reactor-pulse'),
                    raadVisualVisible: !!visual8 && visual8.getBoundingClientRect().width > 0 && visual8.getBoundingClientRect().height > 0,
                    raadCardVisible: !!card8 && card8.getBoundingClientRect().width > 0 && card8.getBoundingClientRect().height > 0 && getComputedStyle(card8).visibility !== 'hidden' && getComputedStyle(card8).display !== 'none' && Number(getComputedStyle(card8).opacity || 1) > 0,
                    rahhesabVisualVisible: !!visualRect && visualRect.width > 0 && visualRect.height > 0,
                    rahhesabCardVisible: !!cardRect && cardRect.width > 0 && cardRect.height > 0 && cardStyle?.visibility !== 'hidden' && cardStyle?.display !== 'none' && Number(cardStyle?.opacity || 1) > 0,
                    overflow,
                    badItems
                  };
                });

                if (errors.length) throw new Error(viewport.name + ' runtime errors: ' + errors.join(' | '));
                if (state.projects !== 9) throw new Error(viewport.name + ' expected 9 timeline projects, got ' + state.projects);
                if (!state.project7 || !state.rahhesabLink) throw new Error(viewport.name + ' PROJECT 07 / Rahhesab link missing');
                if (!state.rahhesabVisualVisible || !state.rahhesabCardVisible) throw new Error(viewport.name + ' Rahhesab visual/card is not visible');
                if (!state.project8 || !state.raadLink) throw new Error(viewport.name + ' PROJECT 08 / RAAD link missing');
                if (!state.project9 || !state.gameLaunchLink) throw new Error(viewport.name + ' PROJECT 09 / game launch link missing');
                if (!state.summary9) throw new Error(viewport.name + ' 9-project summary counter missing');
                if (!state.sargozashtVisualVisible || !state.sargozashtCardVisible) throw new Error(viewport.name + ' Sargozasht visual/card is not visible');
                if (!state.sargozashtImageLoaded) throw new Error(viewport.name + ' Sargozasht cover image did not load');
                if (!state.raadExpansionVisible || !state.raadEnglishExpansion || !state.raadPersianMeaning) throw new Error(viewport.name + ' RAAD expansion / Persian meaning missing');
                if (state.obsoleteVpnNotice) throw new Error(viewport.name + ' obsolete amirvpn notice still appears');
                if (!state.raadReactor || !state.raadReactorPulse) throw new Error(viewport.name + ' RAAD reactor / pulse effect missing');
                if (state.raadReactorSpinDuration !== '7s' || state.raadReactorPulseDuration !== '5s') throw new Error(viewport.name + ' RAAD reactor animation timing is incorrect');
                if (!state.raadVisualVisible || !state.raadCardVisible) throw new Error(viewport.name + ' RAAD visual/card is not visible');
                if (state.overflow || state.badItems.length) throw new Error(viewport.name + ' horizontal overflow: ' + JSON.stringify(state.badItems));

                await page.close();
                console.log(viewport.name + ': PASS');
              }
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          NODE
