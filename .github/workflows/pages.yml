name: Validate portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate required files
        shell: bash
        run: |
          test -f index.html
          test -f styles.css
          test -f script.js
          test -f 404.html
          echo "Portfolio files are present."
